<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ group.name }}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='group.css') }}">
    </head>
    <body>
        <header>
            <a href="{{ url_for('home_page') }}">Home</a>
        </header>
        <main class="group-card">
            <h1>{{ group.name }}</h1>
            <p class="group-description">{{ group.description }}</p>
            <div class="group-details">
                <p><strong>Group Code:</strong> {{ group.code }}</p>
                <p><strong>Members:</strong> {{ group.members|length }}</p>
            </div>
            <h2 class="members-title">Members</h2>
            <ul class="member-list">
                {% for member in group.members %}
                    <li>
                        <a href="{{ url_for('user', username=member.username) }}">
                            {{ member.username }}
                        </a>
                    </li>
                {% endfor %}
            </ul>
        </main>
    </body>
</html>
