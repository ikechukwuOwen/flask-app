<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Login</title>
        <link rel="stylesheet" href="{{ url_for ('static', filename = 'entrance.css') }}">
    </head>
    <body>
        <div class="entrance_form">
            <h1> Register </h1>
            <form action="" method="post">
                {{ form.hidden_tag() }}
                <p>
                    {{ form.username.label }}<br>
                    {{ form.username(size = 32) }}<br>
                </p>
                <p>
                    {{ form.password.label }}<br>
                    {{ form.password(size = 32) }}<br>
                </p>
                <p class="remember-row">
                    {{ form.remember_me }}
                    {{ form.remember_me.label }}
                </p>
                <p>{{ form.submit() }}</p>
            </form>
        </div>
    </body>
</html>
