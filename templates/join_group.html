{% extends "formbase.html" %}
{% block title %}Join Group{% endblock %}
{% block content %}
  <div class="entrance_form">
            <h1> Join A Group </h1>
            <form action="" method="post">
                {{ form.hidden_tag() }}
                <p>
                    {{ form.groupname.label }}<br>
                    {{ form.groupname(size = 32) }}<br>
                </p>
                <p>
                    {{ form.groupcode.label }}<br>
                    {{ form.groupcode(size = 32) }}<br>
                </p>
                <p>{{ form.submit() }}</p>
            </form>
        </div>  
{% endblock %}
