<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Homepage</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
    </head>
    <body>
       {% with messages = get_flashed_messages() %}
           {% if messages %}
               <div class="flash-messages">
                   {% for message in messages %}
                       <p>{{ message }}</p>
                   {% endfor %}
               </div>
           {% endif %}
       {% endwith %}
       <header>
            <a href="{{ url_for('user', username = current_user.username) }}">User</a> <a href="{{ url_for( 'logout') }}">logout</a>
       </header>
       <main class="home-card">
           <h1>Hello! {{ user }}</h1>
           {% if not group %}
           <div class="home-actions">
               <a class="button" href="{{ url_for('join_group') }}">Join Group</a>
               <a class="button" href="{{ url_for('create_group') }}">Create Group</a>
           </div>
           {% endif %}
       </main>
    </body>
</html>
